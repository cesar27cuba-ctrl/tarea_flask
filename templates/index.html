<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            display: flex;
            min-height: 100vh;
            background: #0f1219;
            color: #e0e4ed;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background: #161b25;
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar .logo {
            font-size: 20px;
            font-weight: 700;
            padding: 0 24px 28px;
            color: #fff;
            letter-spacing: 0.5px;
        }
        .sidebar .logo span {
            color: #4f8cff;
        }
        .sidebar nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 0 12px;
        }
        .sidebar nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 12px;
            border-radius: 8px;
            text-decoration: none;
            color: #8892a6;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
        }
        .sidebar nav a:hover,
        .sidebar nav a.active {
            background: #1f2638;
            color: #e0e4ed;
        }
        .sidebar nav a.active {
            color: #4f8cff;
        }
        .sidebar .icon {
            width: 20px;
            text-align: center;
            font-size: 16px;
        }

        /* Main wrapper */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 32px;
            background: #161b25;
            border-bottom: 1px solid #1e2536;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }
        .header .admin {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f8cff, #6c5ce7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: #fff;
        }
        .header .admin span {
            font-size: 14px;
            color: #8892a6;
        }

        /* Content */
        .content {
            padding: 28px 32px;
            flex: 1;
            overflow-y: auto;
        }

        /* Metric cards */
        .metrics {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 28px;
        }
        .card {
            background: #161b25;
            border-radius: 12px;
            padding: 20px 24px;
            border: 1px solid #1e2536;
        }
        .card .label {
            font-size: 13px;
            color: #8892a6;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
        }
        .card .value {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
        }
        .card .change {
            font-size: 13px;
            margin-top: 6px;
        }
        .card .change.positive {
            color: #34d399;
        }
        .card .change.negative {
            color: #f87171;
        }

        /* Charts row */
        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .chart-box {
            background: #161b25;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #1e2536;
        }
        .chart-box h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #fff;
        }

        /* Bar chart */
        .bar-chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            height: 200px;
            padding-top: 8px;
            gap: 8px;
        }
        .bar-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
        }
        .bar {
            width: 100%;
            max-width: 40px;
            border-radius: 4px 4px 0 0;
            background: linear-gradient(to top, #4f8cff, #6c5ce7);
            min-height: 4px;
            transition: 0.3s;
        }
        .bar-group:hover .bar {
            opacity: 0.8;
        }
        .bar-label {
            font-size: 11px;
            color: #8892a6;
            margin-top: 8px;
        }

        /* Doughnut chart */
        .doughnut-wrapper {
            display: flex;
            align-items: center;
            gap: 28px;
        }
        .doughnut {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: conic-gradient(
                #4f8cff 0% 45%,
                #34d399 45% 70%,
                #fbbf24 70% 85%,
                #f87171 85% 95%,
                #8892a6 95% 100%
            );
            flex-shrink: 0;
        }
        .legend {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            flex-shrink: 0;
        }
        .legend-item .pct {
            margin-left: auto;
            color: #8892a6;
        }

        @media (max-width: 900px) {
            .sidebar {
                width: 64px;
            }
            .sidebar .logo,
            .sidebar nav a span {
                display: none;
            }
            .sidebar nav a {
                justify-content: center;
                padding: 12px;
            }
            .sidebar .logo {
                padding: 0 0 28px;
                text-align: center;
            }
            .metrics {
                grid-template-columns: repeat(2, 1fr);
            }
            .charts {
                grid-template-columns: 1fr;
            }
            .doughnut-wrapper {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
    <div class="logo">Admin<span>Pro</span></div>
    <nav>
        <a href="#" class="active"><span class="icon">&#9632;</span><span>Dashboard</span></a>
        <a href="#"><span class="icon">&#128101;</span><span>Usuarios</span></a>
        <a href="#"><span class="icon">&#128176;</span><span>Ventas</span></a>
        <a href="#"><span class="icon">&#128200;</span><span>Reportes</span></a>
        <a href="#"><span class="icon">&#9881;</span><span>Ajustes</span></a>
    </nav>
</aside>

<!-- Main -->
<div class="main">

    <header class="header">
        <h1>Dashboard</h1>
        <div class="admin">
            <span>Admin</span>
            <div class="avatar">A</div>
        </div>
    </header>

    <div class="content">

        <!-- Metrics -->
        <div class="metrics">
            <div class="card">
                <div class="label">Ingresos</div>
                <div class="value">$47.2k</div>
                <div class="change positive">&#9650; +12.5%</div>
            </div>
            <div class="card">
                <div class="label">Usuarios</div>
                <div class="value">+2.1k</div>
                <div class="change positive">&#9650; +8.3%</div>
            </div>
            <div class="card">
                <div class="label">Pedidos</div>
                <div class="value">1,432</div>
                <div class="change positive">&#9650; +4.7%</div>
            </div>
            <div class="card">
                <div class="label">Crecimiento</div>
                <div class="value">23.8%</div>
                <div class="change negative">&#9660; -2.1%</div>
            </div>
        </div>

        <!-- Charts -->
        <div class="charts">

            <!-- Bar chart -->
            <div class="chart-box">
                <h3>Ventas Mensuales</h3>
                <div class="bar-chart">
                    <div class="bar-group">
                        <div class="bar" style="height: 30%;"></div>
                        <span class="bar-label">Ene</span>
                    </div>
                    <div class="bar-group">
                        <div class="bar" style="height: 55%;"></div>
                        <span class="bar-label">Feb</span>
                    </div>
                    <div class="bar-group">
                        <div class="bar" style="height: 40%;"></div>
                        <span class="bar-label">Mar</span>
                    </div>
                    <div class="bar-group">
                        <div class="bar" style="height: 70%;"></div>
                        <span class="bar-label">Abr</span>
                    </div>
                    <div class="bar-group">
                        <div class="bar" style="height: 60%;"></div>
                        <span class="bar-label">May</span>
                    </div>
                    <div class="bar-group">
                        <div class="bar" style="height: 90%;"></div>
                        <span class="bar-label">Jun</span>
                    </div>
                </div>
            </div>

            <!-- Doughnut chart -->
            <div class="chart-box">
                <h3>Categorías</h3>
                <div class="doughnut-wrapper">
                    <div class="doughnut"></div>
                    <div class="legend">
                        <div class="legend-item">
                            <span class="legend-dot" style="background:#4f8cff;"></span>
                            Electrónica
                            <span class="pct">45%</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-dot" style="background:#34d399;"></span>
                            Ropa
                            <span class="pct">25%</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-dot" style="background:#fbbf24;"></span>
                            Hogar
                            <span class="pct">15%</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-dot" style="background:#f87171;"></span>
                            Libros
                            <span class="pct">10%</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-dot" style="background:#8892a6;"></span>
                            Otros
                            <span class="pct">5%</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>
</div>

</body>
</html>
